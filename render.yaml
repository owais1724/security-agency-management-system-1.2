services:
  # Backend Service
  - type: web
    name: sams-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sams-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: sams-frontend
          property: host

  # Frontend Service
  - type: web
    name: sams-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: sams-backend
          property: host
      - key: NODE_ENV
        value: production

databases:
  - name: sams-db
    plan: free # Change to 'standard' for production use
