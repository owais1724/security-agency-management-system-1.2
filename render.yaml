services:
  # Backend Service
  - type: web
    name: sams-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sams-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1d
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: sams-frontend
          property: url

  # Frontend Service
  - type: web
    name: sams-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    # Pass backend URL as a build argument
    dockerBuildArgs:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: sams-backend
          property: url
      - key: NODE_ENV
        value: production

databases:
  # Managed PostgreSQL Database
  - name: sams-db
    databaseName: sams_db
    user: sams_user
    plan: free # Change to standard/starter if needed for production
